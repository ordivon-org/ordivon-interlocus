name: Interlocus owner evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  owner-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      evidence_outcome: ${{ steps.classify.outputs.evidence_outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record bounded evidence identity
        shell: bash
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          printf 'event=%s\n' "$GITHUB_EVENT_NAME"
          printf 'github_sha=%s\n' "$GITHUB_SHA"
          printf 'integration_sha=%s\n' "$GITHUB_SHA"
          printf 'checkout_head=%s\n' "$(git rev-parse HEAD)"
          printf 'candidate_head_sha=%s\n' "${CANDIDATE_HEAD_SHA:-}"
          printf 'base_sha=%s\n' "${BASE_SHA:-}"
          printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
          printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
          printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
          sha256sum \
            .github/workflows/owner-evidence.yml \
            scripts/owner-environment \
            scripts/check_authority.py \
            authority/CURRENT.json
      - name: Verify current checkout authority lineage
        id: lineage
        continue-on-error: true
        run: scripts/owner-environment test
      - name: Verify archive-portable owner recovery
        id: recovery
        continue-on-error: true
        run: scripts/owner-environment cold-start
      - name: Classify bounded owner evidence
        id: classify
        if: always()
        shell: bash
        env:
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          set -euo pipefail
          if [[ "$LINEAGE_OUTCOME" == success && "$RECOVERY_OUTCOME" == success ]]; then
            evidence=SATISFIED
          else
            evidence=FAILED_UNCLASSIFIED
          fi
          printf 'lineage_outcome=%s\n' "$LINEAGE_OUTCOME"
          printf 'recovery_outcome=%s\n' "$RECOVERY_OUTCOME"
          printf 'evidence_outcome=%s\n' "$evidence"
          printf 'evidence_outcome=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
      - name: Preserve A1 evidence failure semantics
        if: always() && (steps.lineage.outcome != 'success' || steps.recovery.outcome != 'success')
        shell: bash
        env:
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          printf 'owner evidence was not satisfied: lineage=%s recovery=%s\n' "$LINEAGE_OUTCOME" "$RECOVERY_OUTCOME" >&2
          exit 1

  shadow-source-admission:
    name: shadow-source-admission
    needs: owner-evidence
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Project hypothetical source admission
        shell: bash
        env:
          EVIDENCE_JOB_RESULT: ${{ needs.owner-evidence.result }}
          EVIDENCE_OUTCOME: ${{ needs.owner-evidence.outputs.evidence_outcome }}
          INTEGRATION_SHA: ${{ github.sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          evidence=${EVIDENCE_OUTCOME:-UNKNOWN}
          if [[ "$EVIDENCE_JOB_RESULT" == success && "$evidence" == SATISFIED ]]; then
            decision=WOULD_ADMIT
            reason=required_owner_evidence_satisfied
          else
            decision=WOULD_HOLD
            reason=required_owner_evidence_not_satisfied
          fi
          printf 'policy=ordivon.interlocus.shadow-source-admission.v1\n'
          printf 'transition=candidate-source-to-canonical-main\n'
          printf 'candidate_head_sha=%s\n' "$CANDIDATE_HEAD_SHA"
          printf 'base_sha=%s\n' "$BASE_SHA"
          printf 'integration_sha=%s\n' "$INTEGRATION_SHA"
          printf 'subject_sha=%s\n' "$INTEGRATION_SHA"
          printf 'head_ref=%s\n' "$HEAD_REF"
          printf 'base_ref=%s\n' "$BASE_REF"
          printf 'evidence_job_result=%s\n' "$EVIDENCE_JOB_RESULT"
          printf 'evidence_outcome=%s\n' "$evidence"
          printf 'shadow_decision=%s\n' "$decision"
          printf 'shadow_reason=%s\n' "$reason"
          printf 'authority=NONE_SHADOW_ONLY\n'
          {
            printf '### Shadow source admission\n\n'
            printf -- '- Transition: candidate-source-to-canonical-main\n'
            printf -- '- Candidate head: %s\n' "$CANDIDATE_HEAD_SHA"
            printf -- '- Base: %s\n' "$BASE_SHA"
            printf -- '- Integration candidate: %s\n' "$INTEGRATION_SHA"
            printf -- '- Evidence outcome: %s\n' "$evidence"
            printf -- '- Decision: %s\n' "$decision"
            printf -- '- Authority: NONE_SHADOW_ONLY\n'
          } >> "$GITHUB_STEP_SUMMARY"
